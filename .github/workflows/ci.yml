name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (Release CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GUI build dependencies (X11/OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DGLFW_BUILD_WAYLAND=OFF .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Smoke test — version
        run: ./build/burst --version

      - name: Smoke test — help
        run: ./build/burst --help | head -n 40

  linux-arm64:
    name: Linux ARM64 (Release CLI, cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross toolchain and qemu
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static

      - name: Configure (cross-compile, CLI only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_GUI=OFF .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Verify architecture
        run: file build/burst | grep aarch64

      - name: Smoke test — version (qemu)
        run: QEMU_LD_PREFIX=/usr/aarch64-linux-gnu qemu-aarch64-static ./build/burst --version

      - name: Smoke test — help (qemu)
        run: QEMU_LD_PREFIX=/usr/aarch64-linux-gnu qemu-aarch64-static ./build/burst --help | head -n 40

  windows:
    name: Windows x86_64 (Release CLI, MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Smoke test — version
        run: ./build/burst.exe --version

      - name: Smoke test — help
        run: ./build/burst.exe --help | head -n 40

  tests:
    name: Unit tests (C++17, pure logic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build-tests -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF .

      - name: Build tests
        run: cmake --build build-tests --target burst-tests --parallel 2

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  download-regression:
    name: Download regression (local HTTP server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF .

      - name: Build burst CLI
        run: cmake --build build --target burst --parallel 2

      - name: Run download regression
        run: python3 scripts/run_download_regression.py --burst ./build/burst
