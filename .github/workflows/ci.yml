name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (Release CLI)
            os: ubuntu-latest
            shell: bash
            generator: ""
            binary: build/burst
          - name: Windows x86_64 (Release CLI, MinGW)
            os: windows-latest
            shell: "msys2 {0}"
            generator: "-G Ninja"
            binary: build/burst.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: ${{ matrix.shell }}
        run: cmake -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF .

      - name: Build
        shell: ${{ matrix.shell }}
        run: cmake --build build --target burst --parallel 2

      - name: Smoke test — version
        shell: ${{ matrix.shell }}
        run: ${{ matrix.binary }} --version

      - name: Smoke test — help
        shell: ${{ matrix.shell }}
        run: ${{ matrix.binary }} --help | head -n 40
