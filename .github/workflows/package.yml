name: Package (embedded verify)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 (embedded package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (runtime pyc bytecode)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GUI build dependencies (X11/OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DGLFW_BUILD_WAYLAND=OFF .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Package single-file release
        run: python scripts/package_release.py --platform linux-x86_64 --exe build/burst --runtime third_party/python/runtime --out burst-linux-x86_64

      - name: Verify packaged binary (embedded runtime end to end)
        run: ./burst-linux-x86_64 --verify-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: burst-linux-x86_64
          path: burst-linux-x86_64
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 (embedded package, CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (runtime pyc bytecode)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure (cross-compile, CLI only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_GUI=OFF .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Verify architecture
        run: file build/burst | grep aarch64

      - name: Package single-file release
        run: python scripts/package_release.py --platform linux-aarch64 --exe build/burst --runtime third_party/python/runtime --out burst-linux-aarch64

      - name: Verify embedded runtime footer
        run: python3 -c "import struct; d=open('burst-linux-aarch64','rb').read(); t=d[-32:]; assert t[:8]==b'BURSTARC' and t[-8:]==b'BURSTEND'; n,h=struct.unpack('<QQ',t[8:24]); assert n==len(d)-32; print('embedded runtime footer OK, blob', n, 'bytes')"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: burst-linux-aarch64
          path: burst-linux-aarch64
          if-no-files-found: error

  windows:
    name: Windows x86_64 (embedded package)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (runtime pyc bytecode)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Package zip release
        run: python scripts/package_release.py --platform windows-x86_64 --exe build/burst.exe --runtime third_party/python/runtime --build-dir build --out burst-windows-x86_64.zip

      - name: Verify packaged zip (embedded runtime end to end)
        run: |
          python -m zipfile -e burst-windows-x86_64.zip verify-stage
          ./verify-stage/burst.exe --verify-runtime
          rm -rf verify-stage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: burst-windows-x86_64.zip
          path: burst-windows-x86_64.zip
          if-no-files-found: error
