name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-release-ref:
    name: Guard - tag must match main HEAD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main tip
        run: git fetch --depth=1 origin main

      - name: Compare tag with main
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "tag  = ${TAG_SHA} (${GITHUB_REF_NAME})"
          echo "main = ${MAIN_SHA}"
          if [ "${TAG_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} would build stale code: the tag is not main HEAD."
            echo "::error::Push main first, or move the tag with: git tag -f ${GITHUB_REF_NAME} main && git push -f origin ${GITHUB_REF_NAME}"
            git log --oneline "${TAG_SHA}..${MAIN_SHA}" 2>/dev/null | sed 's/^/  missing from tag: /' || true
            exit 1
          fi
          echo "OK: tag matches main HEAD"

  linux-x86_64:
    name: Linux x86_64 Release
    needs: [verify-release-ref]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (runtime pyc bytecode)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GUI build dependencies (X11/OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DGLFW_BUILD_WAYLAND=OFF -DBURST_VERSION=${GITHUB_REF_NAME#v} .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Package single-file release
        run: python scripts/package_release.py --platform linux-x86_64 --exe build/burst --runtime third_party/python/runtime --out burst-linux-x86_64

      - name: Verify packaged binary (embedded runtime end to end)
        run: ./burst-linux-x86_64 --verify-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: burst-linux-x86_64
          path: burst-linux-x86_64
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 Release
    needs: [verify-release-ref]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (runtime pyc bytecode)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure (cross-compile, CLI only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_GUI=OFF -DBURST_VERSION=${GITHUB_REF_NAME#v} .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Verify architecture
        run: file build/burst | grep aarch64

      - name: Package single-file release
        run: python scripts/package_release.py --platform linux-aarch64 --exe build/burst --runtime third_party/python/runtime --out burst-linux-aarch64

      - name: Verify embedded runtime footer
        run: python3 -c "import struct; d=open('burst-linux-aarch64','rb').read(); t=d[-32:]; assert t[:8]==b'BURSTARC' and t[-8:]==b'BURSTEND'; n,h=struct.unpack('<QQ',t[8:24]); assert n==len(d)-32; print('embedded runtime footer OK, blob', n, 'bytes')"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: burst-linux-aarch64
          path: burst-linux-aarch64
          if-no-files-found: error

  windows:
    name: Windows x86_64 Release
    needs: [verify-release-ref]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (runtime pyc bytecode)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBURST_VERSION=${GITHUB_REF_NAME#v} .

      - name: Build
        run: cmake --build build --target burst --parallel 2

      - name: Package zip release
        run: python scripts/package_release.py --platform windows-x86_64 --exe build/burst.exe --runtime third_party/python/runtime --build-dir build --out burst-windows-x86_64.zip

      - name: Verify packaged zip (embedded runtime end to end)
        run: |
          python -m zipfile -e burst-windows-x86_64.zip verify-stage
          ./verify-stage/burst.exe --verify-runtime
          rm -rf verify-stage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: burst-windows-x86_64.zip
          path: burst-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [linux-x86_64, linux-arm64, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd assets
          sha256sum burst-* | tee SHA256SUMS.txt

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign release artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd assets
          for f in burst-* SHA256SUMS.txt; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign --output "$f.sig" "$f"
          done

      - name: Add public key to release assets
        run: cp burst-public-key.asc assets/

      - name: Generate release notes
        run: |
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV" ]; then
            git log --oneline "$PREV..HEAD" > changes.txt
          else
            git log --oneline -10 > changes.txt
          fi
          {
            echo "## burst ${GITHUB_REF_NAME}"
            echo
            echo "### 变更记录"
            cat changes.txt
            echo
            echo "### 平台产物"
            echo "- burst-linux-x86_64 : 单文件（curl/Python/FFmpeg 静态，依赖桌面 libGL/X11）"
            echo "- burst-linux-aarch64 : 交叉编译（CLI）"
            echo "- burst-windows-x86_64.zip : burst.exe + Python 运行 dll（解压即用）"
          } > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          body_path: release-body.md
